name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (debug-signed)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          echo "Built APKs:"; ls -1 *.apk
          for apk in *.apk; do
            case "$apk" in
              *arm64-v8a*)   abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *universal*)   abi=universal ;;
              *)             abi=unknown ;;
            esac
            mv "$apk" "BlackBoxReborn-${{ steps.version.outputs.VERSION }}-${abi}.apk"
          done
          echo "Renamed:"; ls -1 BlackBoxReborn-*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BlackBox Reborn ${{ steps.version.outputs.VERSION }}
          body: |
            See [CHANGELOG.md](https://github.com/mafanding/BlackBoxReborn/blob/main/CHANGELOG.md) for what changed.

            **Downloads:** `arm64-v8a` for most modern phones · `armeabi-v7a` for older 32-bit devices · `universal` runs on any ABI.

            **Fixes included:** PackageParserFix · ArtMethodFix · GMS signature passthrough · NativeCore UID spoof
          files: app/build/outputs/apk/release/BlackBoxReborn-*.apk
